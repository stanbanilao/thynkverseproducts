name: Publish iThynk v1.1.7

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-ithynk-v1.1.7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-38c8-820e-8aae-5b819e9d357f/raw?se=2026-09-17T06%3A05%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=3eddcbc2-c684-5be1-a2c5-4b75dba05a48&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A17%3A24Z&ske=2026-09-17T20%3A17%3A24Z&sks=b&skv=2026-02-06&sig=uXW6DP47OqUZyho1NyGKprtkFDaULNBzK26IvwkFkvI%3D"

    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v5

      - name: Download verified iThynk build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $zip = Join-Path $PWD "release\iThynk-v1.1.7-Portable.zip"
          Invoke-WebRequest -Uri $env:SOURCE_URL -OutFile $zip
          $size = (Get-Item $zip).Length
          Write-Host "Downloaded bytes: $size"
          if ($size -lt 300000000) { throw "Downloaded package is incomplete: $size bytes." }
          $extract = Join-Path $env:RUNNER_TEMP "ithynk-v117"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem $extract -Recurse -Filter "iThynk-v1.1.7.exe" | Select-Object -First 1
          if (-not $exe) { throw "iThynk-v1.1.7.exe was not found." }
          $chrome = Get-ChildItem $extract -Recurse -Filter "chrome.exe" | Select-Object -First 1
          if (-not $chrome) { throw "Bundled Chromium is missing." }
          "APP_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup." }

      - name: Build installer
        shell: pwsh
        run: |
          $iss = Join-Path $env:RUNNER_TEMP "ithynk-v117.iss"
          $out = Join-Path $PWD "release"
          @"
[Setup]
AppId={{A2F95458-3B8B-4AE6-9CD4-117001117001}
AppName=iThynk
AppVersion=1.1.7
AppPublisher=Thynkverse
DefaultDirName={autopf}\Thynkverse\iThynk
DefaultGroupName=iThynk
OutputDir=$out
OutputBaseFilename=iThynk-Setup-v1.1.7
Compression=lzma2
SolidCompression=yes
WizardStyle=modern
ArchitecturesAllowed=x64compatible
PrivilegesRequired=lowest
UninstallDisplayIcon={app}\iThynk-v1.1.7.exe

[Files]
Source: "$env:APP_DIR\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

[Icons]
Name: "{autoprograms}\iThynk"; Filename: "{app}\iThynk-v1.1.7.exe"
Name: "{autodesktop}\iThynk"; Filename: "{app}\iThynk-v1.1.7.exe"

[Run]
Filename: "{app}\iThynk-v1.1.7.exe"; Description: "Launch iThynk"; Flags: nowait postinstall skipifsilent
"@ | Set-Content -Path $iss -Encoding utf8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
          if (-not (Test-Path "release\iThynk-Setup-v1.1.7.exe")) { throw "Installer was not created." }

      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ithynk-v1.1.7
          name: iThynk v1.1.7
          make_latest: true
          body: |
            iThynk v1.1.7 - DC Evidence & Reconciliation

            Windows desktop release by Thynkverse.
            Bundled Chromium is included.
            Download iThynk-Setup-v1.1.7.exe for the normal Windows installation.
            Human DC/Admin assessment remains required.
          files: |
            release/iThynk-Setup-v1.1.7.exe
            release/iThynk-v1.1.7-Portable.zip
