name: Publish Chatto 3.1.2 TEST Copy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-chatto-v3.1.2-test-copy.yml"

permissions:
  contents: write

jobs:
  publish-test-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify controlled private TEST artifact
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-cbd8-820e-a149-1e386a1dd404/raw?se=2026-10-03T11%3A54%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=fca9fae6-dbdb-5962-a7c7-01bcc41a9df0&skoid=9fcafdab-1a9a-48a1-833e-6f0dce81fc66&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T19%3A58%3A57Z&ske=2026-10-03T19%3A58%3A57Z&sks=b&skv=2026-02-06&sig=QpU3fFCw1N90nkc35ps4unchwrs6vmbxDsIBvB6n/r8%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "87b45a2cd3cd22a9569c4d7ebcaebbe43819853bbd6c54ee7f5be6a56cc138fe  artifact.zip" | sha256sum -c -
          unzip -q artifact.zip -d unpacked
          find unpacked -maxdepth 3 -type f -print
          test -f unpacked/USB-READY/Chatto-Version-3.1.2-TEST-Setup.exe
          test -f unpacked/USB-READY/Chatto-Version-3.1.2-TEST-Setup.sha256.txt
          test -f unpacked/USB-READY/CHATTO-3.1.2-TEST-BUILD-INFO.txt
          test $(stat -c%s unpacked/USB-READY/Chatto-Version-3.1.2-TEST-Setup.exe) -eq 259349280
          echo "cdc642b6abb6cb8cdc4ca37a91949e0e46649e9474b1e88411f97989a9b93ce9  unpacked/USB-READY/Chatto-Version-3.1.2-TEST-Setup.exe" | sha256sum -c -
          recorded=$(tr '[:upper:]' '[:lower:]' < unpacked/USB-READY/Chatto-Version-3.1.2-TEST-Setup.sha256.txt | tr -d '\r\n ')
          test "$recorded" = "cdc642b6abb6cb8cdc4ca37a91949e0e46649e9474b1e88411f97989a9b93ce9"
          grep -q "Version=3.1.2" unpacked/USB-READY/CHATTO-3.1.2-TEST-BUILD-INFO.txt
          grep -q "ProductCode=CHATTO" unpacked/USB-READY/CHATTO-3.1.2-TEST-BUILD-INFO.txt
          grep -q "ModelCode=BASE" unpacked/USB-READY/CHATTO-3.1.2-TEST-BUILD-INFO.txt
          grep -q "Environment=TEST" unpacked/USB-READY/CHATTO-3.1.2-TEST-BUILD-INFO.txt
          grep -q "SourceCommit=f8327f142acfaaaf9b167e8506ec7ba41ef12032" unpacked/USB-READY/CHATTO-3.1.2-TEST-BUILD-INFO.txt

      - name: Publish controlled TEST prerelease to download repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="chatto-v3.1.2-test-20261003"
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG"             unpacked/USB-READY/Chatto-Version-3.1.2-TEST-Setup.exe             unpacked/USB-READY/Chatto-Version-3.1.2-TEST-Setup.sha256.txt             unpacked/USB-READY/CHATTO-3.1.2-TEST-BUILD-INFO.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Chatto 3.1.2 TEST"             --notes "CONTROLLED TEST HOTFIX COPY — NOT DEMO / NOT LIVE. ProductCode=CHATTO; ModelCode=BASE; Environment=TEST; ReleaseChannel=TEST. Exact verified copy of private artifact built from source commit f8327f142acfaaaf9b167e8506ec7ba41ef12032, workflow run 37120466654. Existing CHATTO/BASE/TEST worker licence and device binding are retained. 106 tests passed twice. Packaged activation smoke PASS. Installer SHA-256: cdc642b6abb6cb8cdc4ca37a91949e0e46649e9474b1e88411f97989a9b93ce9."             --prerelease             --latest=false

      - name: Verify published download-repo copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://github.com/stanbanilao/thynkverseproducts/releases/download/chatto-v3.1.2-test-20261003/Chatto-Version-3.1.2-TEST-Setup.exe"
          curl --fail --location --retry 3 "$URL" -o public-copy.exe
          test $(stat -c%s public-copy.exe) -eq 259349280
          echo "cdc642b6abb6cb8cdc4ca37a91949e0e46649e9474b1e88411f97989a9b93ce9  public-copy.exe" | sha256sum -c -
          gh release view "chatto-v3.1.2-test-20261003" --repo "$GITHUB_REPOSITORY" --json tagName,name,isPrerelease,url,assets
